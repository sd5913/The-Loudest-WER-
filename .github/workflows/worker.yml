name: Worker checks and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - run: npm ci
      - run: npm run test:worker
      - run: npm run build:assets
      - run: ./node_modules/.bin/wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sd5913/The-Loudest-WER-'
    needs: check
    runs-on: ubuntu-latest
    environment: loudest-wer-worker
    concurrency: loudest-wer-worker-deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - run: npm ci
      - run: npm run build:assets
      - name: Deploy reviewed code and its runtime secret together
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ELEVENLABS_API_KEY"
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/wer-deploy.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export WRANGLER_LOG_PATH="$scratch/wrangler.log"
          export WRANGLER_LOG_SANITIZE=true
          node -e 'process.stdout.write(JSON.stringify({ELEVENLABS_API_KEY:process.env.ELEVENLABS_API_KEY}))' > "$scratch/runtime.json"
          unset ELEVENLABS_API_KEY
          ./node_modules/.bin/wrangler deploy --secrets-file "$scratch/runtime.json"
