<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">The Loudest WER studio interface map</title>
  <desc id="desc">A dark violet pixel-style diagram showing the pet stage, sound editor, pet band, templates, and playback controls.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#4d3b70" stroke-width="1" opacity=".45"/></pattern>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#18132f"/><stop offset=".55" stop-color="#39245d"/><stop offset="1" stop-color="#582f69"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="660" fill="#100c20"/><rect width="1200" height="660" fill="url(#grid)"/>
  <text x="42" y="52" fill="#ffe16a" font-family="monospace" font-size="16" letter-spacing="3">THE LOUDEST WER! / TEAM GUIDE 01</text>
  <text x="42" y="91" fill="#fff0df" font-family="Georgia,serif" font-size="32">One stage. A whole little band.</text>
  <text x="43" y="118" fill="#bba8d4" font-family="Arial,sans-serif" font-size="14">一个舞台 · 一支宠物小乐队</text>

  <!-- Main stage window -->
  <rect x="42" y="148" width="725" height="360" fill="#1c1434" stroke="#a283c8" stroke-width="3"/>
  <rect x="42" y="148" width="725" height="38" fill="#39275f"/>
  <rect x="55" y="160" width="9" height="9" fill="#ffe16a"/><text x="77" y="174" fill="#fff0df" font-family="monospace" font-size="13">STAGE / PET PERFORMANCE</text>
  <text x="722" y="174" fill="#ff8ac6" font-family="monospace" font-size="15">− □ ×</text>
  <rect x="55" y="199" width="699" height="296" fill="url(#sky)"/>
  <!-- pixel stars and moon -->
  <g fill="#ffe16a"><rect x="126" y="229" width="4" height="4"/><rect x="214" y="255" width="4" height="4"/><rect x="307" y="216" width="4" height="4"/><rect x="436" y="254" width="4" height="4"/><rect x="583" y="222" width="4" height="4"/><rect x="683" y="271" width="4" height="4"/></g>
  <circle cx="620" cy="277" r="49" fill="#ffe16a" opacity=".12" filter="url(#glow)"/><circle cx="620" cy="277" r="31" fill="#ffe16a"/>
  <rect x="55" y="390" width="699" height="48" fill="#38234f"/><rect x="55" y="438" width="699" height="57" fill="#241d43"/>
  <path d="M55 390h45l14 9h62l16-12h69l14 10h77l13-8h57l14 10h55l17-9h52l14 11h54l13-10h62l18 8h66" fill="#5e3971"/>
  <g fill="#ff78bc" opacity=".82"><rect x="88" y="417" width="38" height="4"/><rect x="171" y="452" width="51" height="3"/><rect x="494" y="408" width="38" height="4"/><rect x="664" y="463" width="42" height="3"/></g>
  <!-- microphone -->
  <g transform="translate(390 343)"><rect x="-11" y="-43" width="22" height="38" fill="#ffe16a" stroke="#251739" stroke-width="4"/><rect x="-7" y="-38" width="14" height="5" fill="#ff78bc"/><rect x="-7" y="-28" width="14" height="5" fill="#ff78bc"/><rect x="-7" y="-18" width="14" height="5" fill="#ff78bc"/><rect x="-4" y="-5" width="8" height="42" fill="#d9b7e6"/><rect x="-23" y="35" width="46" height="7" fill="#ffe16a"/></g>
  <!-- simplified pixel pets -->
  <g transform="translate(207 365)" fill="#f5bbd8" stroke="#2a1b42" stroke-width="5" shape-rendering="crispEdges"><rect x="-34" y="-34" width="68" height="50"/><rect x="-32" y="-50" width="17" height="18"/><rect x="15" y="-50" width="17" height="18"/><rect x="-24" y="16" width="14" height="17"/><rect x="10" y="16" width="14" height="17"/></g>
  <g transform="translate(565 365)" fill="#d5c1f3" stroke="#2a1b42" stroke-width="5" shape-rendering="crispEdges"><rect x="-36" y="-30" width="72" height="48"/><rect x="-48" y="-20" width="13" height="25"/><rect x="35" y="-20" width="13" height="25"/><rect x="-22" y="18" width="15" height="17"/><rect x="8" y="18" width="15" height="17"/></g>
  <g fill="#241734"><rect x="196" y="355" width="7" height="7"/><rect x="218" y="355" width="7" height="7"/><rect x="554" y="355" width="7" height="7"/><rect x="576" y="355" width="7" height="7"/></g>
  <rect x="76" y="459" width="94" height="24" fill="#281b44" stroke="#ff78bc" stroke-width="2"/><text x="91" y="476" fill="#fff0df" font-family="monospace" font-size="12">MISO · CAT</text>
  <rect x="524" y="459" width="106" height="24" fill="#281b44" stroke="#ffe16a" stroke-width="2"/><text x="538" y="476" fill="#fff0df" font-family="monospace" font-size="12">BISCUIT · PUP</text>

  <!-- sound editor -->
  <rect x="790" y="148" width="367" height="360" fill="#1c1434" stroke="#a283c8" stroke-width="3"/>
  <rect x="790" y="148" width="367" height="38" fill="#4a326d"/><text x="809" y="174" fill="#ffe16a" font-family="monospace" font-size="13">SOUND STUDIO / 声音编辑</text>
  <rect x="812" y="204" width="60" height="60" fill="#342352" stroke="#ff78bc" stroke-width="2"/>
  <g transform="translate(842 238)" fill="#f5bbd8" stroke="#2a1b42" stroke-width="3" shape-rendering="crispEdges"><rect x="-20" y="-13" width="40" height="28"/><rect x="-17" y="-24" width="10" height="12"/><rect x="7" y="-24" width="10" height="12"/></g>
  <text x="890" y="229" fill="#fff0df" font-family="Georgia,serif" font-size="23">Miso</text><text x="891" y="250" fill="#bba8d4" font-family="Arial,sans-serif" font-size="12">The warm little meow · 温暖喵声</text>
  <text x="812" y="296" fill="#ff9aca" font-family="monospace" font-size="12">VOLUME / 音量</text><text x="1104" y="296" fill="#ffe16a" font-family="monospace" font-size="12">62%</text>
  <rect x="812" y="307" width="314" height="8" fill="#3b2b5a"/><rect x="812" y="307" width="190" height="8" fill="#ff78bc"/><rect x="998" y="301" width="13" height="20" fill="#ffe16a" stroke="#241638" stroke-width="2"/>
  <text x="812" y="348" fill="#ff9aca" font-family="monospace" font-size="12">PITCH / 音高</text>
  <rect x="812" y="359" width="314" height="8" fill="#3b2b5a"/><rect x="812" y="359" width="131" height="8" fill="#ffe16a"/><rect x="939" y="353" width="13" height="20" fill="#ff78bc" stroke="#241638" stroke-width="2"/>
  <text x="812" y="400" fill="#ff9aca" font-family="monospace" font-size="12">RHYTHM / 节奏 · 8 STEPS</text>
  <g transform="translate(812 415)"><rect width="32" height="31" fill="#ffe16a"/><rect x="39" width="32" height="31" fill="#2d2149"/><rect x="78" width="32" height="31" fill="#2d2149"/><rect x="117" width="32" height="31" fill="#ff78bc"/><rect x="156" width="32" height="31" fill="#2d2149"/><rect x="195" width="32" height="31" fill="#2d2149"/><rect x="234" width="32" height="31" fill="#ffe16a"/><rect x="273" width="32" height="31" fill="#2d2149"/><g fill="#211536" font-family="monospace" font-size="10" text-anchor="middle"><text x="16" y="20">01</text><text x="55" y="20" fill="#d8c8e9">02</text><text x="94" y="20" fill="#d8c8e9">03</text><text x="133" y="20">04</text><text x="172" y="20" fill="#d8c8e9">05</text><text x="211" y="20" fill="#d8c8e9">06</text><text x="250" y="20">07</text><text x="289" y="20" fill="#d8c8e9">08</text></g></g>
  <rect x="812" y="466" width="314" height="28" fill="#ffe16a" stroke="#ff78bc" stroke-width="2"/><text x="887" y="485" fill="#241536" font-family="monospace" font-weight="bold" font-size="12">▶ PLAY TOGETHER · 一起演奏</text>

  <!-- lower navigation strip -->
  <rect x="42" y="535" width="1115" height="83" fill="#21183d" stroke="#684c8d" stroke-width="2"/>
  <g font-family="monospace" text-anchor="middle">
    <text x="215" y="569" fill="#ffe16a" font-size="14">01 · PICK A MOOD</text><text x="215" y="593" fill="#bba8d4" font-family="Arial,sans-serif" font-size="12">选模板 · 自动编曲</text>
    <text x="596" y="569" fill="#ff78bc" font-size="14">02 · PLAY THE BAND</text><text x="596" y="593" fill="#bba8d4" font-family="Arial,sans-serif" font-size="12">统一节拍 · 宠物发声</text>
    <text x="978" y="569" fill="#ffe16a" font-size="14">03 · TWEAK A SOUND</text><text x="978" y="593" fill="#bba8d4" font-family="Arial,sans-serif" font-size="12">选宠物 · 修改节奏与音色</text>
  </g>
  <path d="M391 576h38m-9-9 9 9-9 9M772 576h38m-9-9 9 9-9 9" fill="none" stroke="#ff78bc" stroke-width="3"/>
</svg>
